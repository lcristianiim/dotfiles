unbind C-b
set -g prefix M-e
bind M-e send-prefix

bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind m resize-pane -Z

# Copy/open URLs from current pane with wrapped lines rejoined (-J).
# Needs ~/bin/tmux-copy-urls. NOTE: actual binds live at the BOTTOM of this file
# (after TPM init) because TPM's own prefix-U binding would clobber them here.

set -sg escape-time 0
set -g default-terminal "xterm-256color"

set-window-option -g mode-keys vi

# Unbind default cursor keys in copy-mode and copy-mode-vi
unbind-key -T copy-mode Up
unbind-key -T copy-mode Down
unbind-key -T copy-mode-vi Up
unbind-key -T copy-mode-vi Down

# Bind arrow keys to scroll
bind-key -T copy-mode Up send-keys -X scroll-up
bind-key -T copy-mode Down send-keys -X scroll-down
bind-key -T copy-mode-vi Up send-keys -X scroll-up
bind-key -T copy-mode-vi Down send-keys -X scroll-down

# Bind vim-like j/k to scroll (not move cursor)
bind-key -T copy-mode-vi j send-keys -X scroll-down
bind-key -T copy-mode-vi k send-keys -X scroll-up

# Bind Alt+w to enter copy mode
bind-key -T root M-w copy-mode
bind-key M-w copy-mode

# --- Nord theme options ---
# Use patched font mode for Powerline arrows (requires Nerd Font)
set -g @nord_tmux_no_patched_font 0
# Show status content (date/time/host)
set -g @nord_tmux_show_status_content 1

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-continuum'
set -g @plugin 'nordtheme/tmux'
set -g @plugin 'Morantron/tmux-fingers'

# tmux-resurrect: save/restore tmux sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# Restore processes: don't restore hermes instances, just basic shells
set -g @resurrect-processes 'false'

# tmux-continuum: auto-save every 15 minutes
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'