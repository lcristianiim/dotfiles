unbind C-b
set -g prefix M-e
bind M-e send-prefix

bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind m resize-pane -Z

set -sg escape-time 0
set -g default-terminal "xterm-256color"

set-window-option -g mode-keys vi

# Unbind default cursor keys in copy-mode and copy-mode-vi
unbind-key -T copy-mode Up
unbind-key -T copy-mode Down
unbind-key -T copy-mode-vi Up
unbind-key -T copy-mode-vi Down

# Bind arrow keys to scroll
bind-key -T copy-mode Up send-keys -X scroll-up
bind-key -T copy-mode Down send-keys -X scroll-down
bind-key -T copy-mode-vi Up send-keys -X scroll-up
bind-key -T copy-mode-vi Down send-keys -X scroll-down

# Bind vim-like j/k to scroll (not move cursor)
bind-key -T copy-mode-vi j send-keys -X scroll-down
bind-key -T copy-mode-vi k send-keys -X scroll-up

# Make active pane obvious
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=brightgreen
set -g window-style 'fg=colour247,bg=colour238'
set -g window-active-style 'fg=colour252,bg=colour236'

# Bind Alt+w to enter copy mode
bind-key -T root M-w copy-mode

# Bind Alt+w to enter copy mode
bind-key M-w copy-mode